version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    target-branch: dev
    commit-message:
      prefix: chore
    groups:
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      build-tooling:
        patterns:
          - vite
          - '@vitejs/*'
          - typescript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    target-branch: dev
    commit-message:
      prefix: chore
