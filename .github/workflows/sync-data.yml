name: Sync data

# Refreshes star/fork counts and the article list (`bun run sync`) and commits
# the result straight to main when anything changed, then deploys.
#
# `bun run readmes` is deliberately not here: it stamps every README with the
# run date, so it would commit every week even with no real change.
#
# A push made with GITHUB_TOKEN does not trigger other workflows, so the deploy
# is started explicitly with workflow_dispatch — the one event it may trigger.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-data
  cancel-in-progress: true

jobs:
  sync:
    name: Sync stars and articles
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync
        run: bun run sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet -- src/lib/data; then
            echo "Nothing changed."
            exit 0
          fi

          # The data files are typed; a malformed feed must not reach main
          bun run typecheck

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/data/repo-stats.ts src/lib/data/articles.ts
          git commit -m "chore(data): sync star counts and articles"
          git push origin HEAD:main

          gh workflow run deploy-pages.yml --ref main
