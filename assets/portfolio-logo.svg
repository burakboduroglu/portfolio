<!--
  Portfolio mark: the collar and tie, flattened. Two inks on a dark warm plate —
  the family language set by Skadi on 2026-09-08. It replaces the 2026-09-02
  mark, which was the same idea with a radial-gradient plate and a rim stroke.
  Geometry traced from the chosen Higgsfield concept
  (studio/output/logo-family/portfolio-v3.png); the collar was widened and the
  blade shortened from it, because at 32 px the original read as a bird.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Portfolio logo">
  <rect width="1024" height="1024" fill="#150A08"/>

  <!-- Collar: two planes meeting just above the knot -->
  <path d="M296 160 L492 352 L372 452 L246 262 Z" fill="#F6ECE9"/>
  <path d="M728 160 L532 352 L652 452 L778 262 Z" fill="#F6ECE9"/>

  <!-- Tie, in the site's own accent -->
  <path d="M512 344 L584 400 L548 442 L476 442 L440 400 Z" fill="#C76F68"/>
  <path d="M464 442 L560 442 L604 800 L512 905 L420 800 Z" fill="#C76F68"/>
</svg>
